# Pull request preview only. Deploy with -a smhy-pr-<number>.
# Do not use this file for the production app "smhy" or for smhy.se.
app = "smhy-pr-placeholder"
primary_region = "arn"

[build]
  dockerfile = "Dockerfile.preview"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
